name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install py65
      - run: tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: edos-build
          path: build/
